
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bac Pro CIEL - Ressources pédagogiques</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #1e293b;
    }

    header { background: #071632; color: white; text-align: center; }
    .hero { position: relative; width: 100%; overflow: hidden; background: #071632; }
    .hero picture, .hero img { display: block; width: 100%; }
    .hero img { height: clamp(120px, 9.5vw, 195px); object-fit: cover; object-position: center; }
    @media (max-width: 767px) and (orientation: portrait) {
      .hero img { height: clamp(220px, 78vw, 400px); object-fit: cover; }
      main { margin-top: 22px; }
    }
    @media (max-width: 1100px) and (orientation: landscape) {
      .hero img { height: auto; object-fit: initial; }
    }

    main {
      max-width: 1000px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .ressource {
      display: block;
      max-width: 450px;
      margin: 0 auto;
      padding: 25px;
      background: white;
      border: 1px solid #dbe2ea;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .ressource:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.10);
    }

    .ressource h3 {
      margin: 0 0 12px;
      color: #17365d;
    }

    .ressource p {
      margin: 0 0 20px;
      line-height: 1.5;
    }

    .acces {
      color: #1558a6;
      font-weight: bold;
    }

    .version { position: fixed; right: 12px; bottom: 8px; font-size: 11px; color: #718096; opacity: .8; pointer-events: none; }
  </style>
</head>
<body>

  <header>
    <div class="hero">
      <picture>
        <source media="(max-width: 767px) and (orientation: portrait)" srcset="assets/bandeau-portrait.webp">
        <source media="(max-width: 1100px) and (orientation: landscape)" srcset="assets/bandeau-paysage.webp">
        <img src="assets/bandeau-pc.webp" alt="Univers technologique CIEL : réseaux, électronique et robotique" width="1600" height="160">
      </picture>
    </div>
  </header>

  <main>
    <a class="ressource"
       href="https://chaoli22000bzh.github.io/Manuel-Adressage-IPv4/">
      <h3>Manuel d'adressage IPv4</h3>
      <p>
        Comprendre les adresses IPv4, les masques
        de sous-réseau et les calculs en binaire
        et en décimal.
      </p>
      <span class="acces">Accéder au manuel →</span>
    </a>
  </main>

  <div class="version" aria-label="Version du portail">V1.0.0</div>
</body>
</html>
