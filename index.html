<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bac Pro CIEL</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#1e293b}
    header{background:#071632}
    .hero{position:relative;width:100%;overflow:hidden;background:#071632}
    .hero picture,.hero img{display:block;width:100%}
    .hero img{height:clamp(120px,9.5vw,195px);object-fit:cover;object-position:center}
    @media(max-width:767px) and (orientation:portrait){.hero img{height:clamp(220px,78vw,400px);object-fit:cover}}
    @media(max-width:1100px) and (orientation:landscape){.hero img{height:auto;object-fit:initial}}
    .version{position:fixed;right:12px;bottom:8px;font-size:11px;color:#718096;opacity:.8;pointer-events:none}
    @media(prefers-color-scheme:dark){body{background:#101826}.version{color:#b3c4dc}}
  </style>
</head>
<body>
  <header>
    <div class="hero">
      <picture>
        <source media="(max-width: 767px) and (orientation: portrait)" srcset="assets/bandeau-portrait.webp">
        <source media="(max-width: 1100px) and (orientation: landscape)" srcset="assets/bandeau-paysage.webp">
        <img src="assets/bandeau-pc.webp" alt="Univers technologique CIEL : réseaux, électronique et robotique" width="1600" height="160">
      </picture>
    </div>
  </header>
  <main></main>
  <div class="version" aria-label="Version du portail">V1.2.22</div>
</body>
</html>
